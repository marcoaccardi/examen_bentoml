service: "src.service:AdmissionPredictionService"
description: "Admission prediction service - JWT-secured /login and /predict"

labels:
  owner: "Marco Accardi"
  project: "admission_prediction"

include:
  - "src/"
exclude:
  - "submission/"

# The model is taken from the local Model Store at build time.
models:
  - admission_lr:latest

python:
  packages:
    - bentoml==1.4.35
    - scikit-learn==1.3.2
    - pandas==2.3.3
    - numpy==1.26.4
    - pydantic==2.12.2
    - pyjwt==2.10.1
